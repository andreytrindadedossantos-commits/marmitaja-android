name: Gerar APK Android MarmitaJa
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          printf 'y\n' | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Criar projeto Android
        shell: bash
        run: |
          mkdir -p androidapp/app/src/main/java/br/com/pedidoagil/marmitaja androidapp/app/src/main/res/drawable
          cat > androidapp/app/src/main/res/drawable/marmitaja_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#2D7B46" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M22,43h64v38c0,6 -5,11 -11,11h-42c-6,0 -11,-5 -11,-11z"/>
            <path android:fillColor="#2D7B46" android:pathData="M22,52h64v5h-64z"/>
            <path android:fillColor="#E8A63C" android:pathData="M34,68h40v7h-40z"/>
            <path android:strokeColor="#FFFFFF" android:strokeWidth="4" android:strokeLineCap="round" android:pathData="M38,36c-7,-8 7,-12 0,-20M54,36c-7,-8 7,-12 0,-20M70,36c-7,-8 7,-12 0,-20"/>
          </vector>
          EOF
          cat > androidapp/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'MarmitaJa'
          include ':app'
          EOF
          cat > androidapp/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'com.google.gms.google-services' version '4.4.2' apply false
          }
          EOF
          cat > androidapp/app/build.gradle <<'EOF'
          plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
          dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.2' }
          android {
              namespace 'br.com.pedidoagil.marmitaja'
              compileSdk 35
              defaultConfig { applicationId 'br.com.pedidoagil.marmitaja'; minSdk 24; targetSdk 35; versionCode 5; versionName '1.4.0' }
          }
          EOF
          cat > androidapp/app/google-services.json <<'EOF'
          {"project_info":{"project_number":"261198321850","project_id":"marmitaja-c2032","storage_bucket":"marmitaja-c2032.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:261198321850:android:898e709495eea544354a83","android_client_info":{"package_name":"br.com.pedidoagil.marmitaja"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyADAaHJE9aqdh3fVAvVhx-xhGnj7yf_FuI"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
          cat > androidapp/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
          android.useAndroidX=true
          EOF
          cat > androidapp/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <application android:icon="@drawable/marmitaja_icon" android:roundIcon="@drawable/marmitaja_icon" android:label="Pedido Ágil" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="false" android:allowBackup="false">
              <service android:name=".MarmitaMessagingService" android:exported="false">
                <intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT"/></intent-filter>
              </service>
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > androidapp/app/src/main/java/br/com/pedidoagil/marmitaja/MarmitaMessagingService.java <<'EOF'
          package br.com.pedidoagil.marmitaja;
          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;
          import android.media.RingtoneManager;
          import android.os.Build;
          import android.app.Notification;
          public class MarmitaMessagingService extends FirebaseMessagingService {
            public void onMessageReceived(RemoteMessage message) {
              String title=message.getData().get("title");
              String body=message.getData().get("body");
              if(title==null && message.getNotification()!=null)title=message.getNotification().getTitle();
              if(body==null && message.getNotification()!=null)body=message.getNotification().getBody();
              if(title==null)title="MarmitaJá";if(body==null)body="Você tem uma atualização.";
              String channel="marmitaja_alertas_v1";
              NotificationManager nm=(NotificationManager)getSystemService(NOTIFICATION_SERVICE);
              if(Build.VERSION.SDK_INT>=26){
                NotificationChannel nc=new NotificationChannel(channel,"Pedidos e atualizações",NotificationManager.IMPORTANCE_HIGH);
                nc.setDescription("Alertas sonoros de pedidos para restaurantes e clientes");
                nc.enableVibration(true);
                nc.setSound(RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION),new android.media.AudioAttributes.Builder().setUsage(android.media.AudioAttributes.USAGE_NOTIFICATION).build());
                nm.createNotificationChannel(nc);
              }
              String role=message.getData().get("role");
              Intent intent=new Intent(this,MainActivity.class);
              intent.putExtra("open_route","customer".equals(role)?"#lojas":"#painel-restaurante");
              intent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP|Intent.FLAG_ACTIVITY_SINGLE_TOP);
              PendingIntent pi=PendingIntent.getActivity(this,0,intent,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);
              Notification.Builder b=Build.VERSION.SDK_INT>=26?new Notification.Builder(this,channel):new Notification.Builder(this);
              b.setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(title).setContentText(body).setAutoCancel(true).setContentIntent(pi).setPriority(Notification.PRIORITY_HIGH);
              nm.notify((int)(System.currentTimeMillis()%Integer.MAX_VALUE),b.build());
            }
            public void onNewToken(String token){ super.onNewToken(token); }
          }
          EOF
          cat > androidapp/app/src/main/java/br/com/pedidoagil/marmitaja/MainActivity.java <<'EOF'
          package br.com.pedidoagil.marmitaja;
          import android.app.Activity;
          import android.webkit.JavascriptInterface;
          import android.os.Build;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import com.google.firebase.messaging.FirebaseMessaging;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.*;
          import android.view.View;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.graphics.Color;
          import android.content.ActivityNotFoundException;
          public class MainActivity extends Activity {
            WebView web; ValueCallback<Uri[]> chooser;
            static final int FILE_REQ = 9001;
            public void onCreate(Bundle saved) {
              super.onCreate(saved);
              if(Build.VERSION.SDK_INT>=33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED) requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},101);
              FirebaseMessaging.getInstance().getToken().addOnSuccessListener(token -> android.util.Log.i("MarmitaPush","FCM pronto"));
              web = new WebView(this);
              web.setBackgroundColor(Color.WHITE);
              setContentView(web);
              WebSettings s=web.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true);
              s.setAllowFileAccess(false); s.setAllowContentAccess(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
              CookieManager.getInstance().setAcceptCookie(true);
              CookieManager.getInstance().setAcceptThirdPartyCookies(web,true);
              web.addJavascriptInterface(new Object(){
                @JavascriptInterface public void registerPush(String role,String slug,String session) {
                  if(!("merchant".equals(role)||"customer".equals(role))||!slug.matches("[a-z0-9-]{3,40}")||!session.matches("[a-f0-9]{64}"))return;
                  FirebaseMessaging.getInstance().getToken().addOnSuccessListener(token -> new Thread(() -> {
                    try{
                      java.net.HttpURLConnection conn=(java.net.HttpURLConnection)new java.net.URL("https://egnhgowhwzxemyhteact.supabase.co/functions/v1/marmitaja-push/register").openConnection();
                      conn.setRequestMethod("POST");conn.setDoOutput(true);conn.setConnectTimeout(10000);conn.setReadTimeout(10000);
                      conn.setRequestProperty("Content-Type","application/json");
                      org.json.JSONObject body=new org.json.JSONObject();
                      body.put("role",role);body.put("slug",slug);body.put("session",session);body.put("fcmToken",token);
                      byte[] data=body.toString().getBytes(java.nio.charset.StandardCharsets.UTF_8);
                      try(java.io.OutputStream os=conn.getOutputStream()){os.write(data);}
                      conn.getInputStream().close();conn.disconnect();
                    }catch(Exception e){android.util.Log.w("MarmitaPush","Registro não concluído");}
                  }).start());
                }
              },"MarmitaAndroid");
              web.setWebChromeClient(new WebChromeClient(){
                public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                  if(chooser!=null)chooser.onReceiveValue(null);
                  chooser=cb;
                  try { startActivityForResult(params.createIntent(),FILE_REQ);return true; }
                  catch(Exception e){chooser=null;return false;}
                }
              });
              web.setWebViewClient(new WebViewClient(){
                @Override public boolean shouldOverrideUrlLoading(WebView view,WebResourceRequest request) {
                  Uri u=request.getUrl();
                  if("https".equals(u.getScheme())&&"marmitaja-delivery.vercel.app".equals(u.getHost()))return false;
                  try{startActivity(new Intent(Intent.ACTION_VIEW,u));}catch(Exception e){}
                  return true;
                }
              });
              String target=getIntent().getStringExtra("open_route");
              web.loadUrl("https://marmitaja-delivery.vercel.app/"+(target==null?"#painel-restaurante":target));
            }
            @Override protected void onActivityResult(int request,int result,Intent data){
              super.onActivityResult(request,result,data);
              if(request==FILE_REQ&&chooser!=null){
                chooser.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(result,data));chooser=null;
              }
            }
            @Override public void onBackPressed(){if(web.canGoBack())web.goBack();else super.onBackPressed();}
            @Override protected void onPause(){CookieManager.getInstance().flush();super.onPause();}
          }
          EOF
      - name: Compilar APK
        working-directory: androidapp
        run: gradle :app:assembleDebug --no-daemon
      - name: Publicar APK na versão estável
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidapp/app/build/outputs/apk/debug/app-debug.apk MarmitaJa.apk
          if gh release view v1.4.0 >/dev/null 2>&1; then
            gh release upload v1.4.0 MarmitaJa.apk --clobber
          else
            gh release create v1.4.0 MarmitaJa.apk --title "Pedido Ágil Android v1.4.0" --notes "Primeira versão de teste do aplicativo Android. Nome do aplicativo alterado para Pedido Ágil. Mesma plataforma e notificações."
          fi
      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MarmitaJa-Android-APK
          path: androidapp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
